name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Scripts and hook tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        run: bash tests/run.sh

  validate:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
