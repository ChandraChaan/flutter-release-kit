name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Scripts and hook tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        run: bash tests/run.sh
      - name: Run Bills and Renewals tests
        run: python3 -m unittest tests/test_renewals.py

  chatgpt-app:
    name: ChatGPT app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chatgpt-flutter-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests/test_server.py

  validate:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
      - name: claude plugin validate (Bills and Renewals)
        run: npx -y @anthropic-ai/claude-code@latest plugin validate plugins/bills-and-renewals --strict
